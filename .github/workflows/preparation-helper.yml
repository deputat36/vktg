name: Preparation helper

on:
  pull_request:
    paths:
      - 'preparation*.html'
      - 'assets/js/preparation/**'
      - 'assets/css/preparation.css'
      - 'config/preparation-catalog.json'
      - 'scripts/check-preparation-helper.mjs'
      - 'tests/unit/preparation-helper.test.mjs'
      - 'tests/e2e/preparation-helper.spec.js'
      - '.github/workflows/preparation-helper.yml'
  push:
    branches: [main]
    paths:
      - 'preparation*.html'
      - 'assets/js/preparation/**'
      - 'assets/css/preparation.css'
      - 'config/preparation-catalog.json'
      - 'scripts/check-preparation-helper.mjs'
      - 'tests/unit/preparation-helper.test.mjs'
      - 'tests/e2e/preparation-helper.spec.js'
      - '.github/workflows/preparation-helper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/unit/preparation-helper.test.mjs
      - run: node scripts/check-preparation-helper.mjs
      - name: Syntax
        run: |
          node --check assets/js/preparation/model.js
          node --check assets/js/preparation/app.js
          node --check assets/js/preparation/editor.js
          node --check tests/e2e/preparation-helper.spec.js

  desktop-mobile:
    needs: scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Synthetic scenarios, privacy, keyboard, responsive views and editor
        run: npx playwright test tests/e2e/preparation-helper.spec.js --project=chromium-desktop --project=chromium-mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preparation-helper-browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
