name: Navigator v2 task permission bridge

on:
  pull_request:
    paths:
      - 'deal-card-v2.html'
      - 'assets/js/nav-v2/task-action-guard-v2.js'
      - 'assets/js/nav-v2/supabase-v2.js'
      - 'tests/e2e/task-permission-bridge.spec.js'
      - 'tests/fixtures/nav-v2-task-action-feedback.html'
      - 'config/nav-v2-task-permission-bridge-v1.json'
      - 'docs/NAV_V2_TASK_PERMISSION_BRIDGE_V1_2026-07-24.md'
      - 'scripts/check_nav_v2_task_permission_bridge_v1.py'
      - '.github/workflows/nav-v2-task-permission-bridge-v1.yml'
  push:
    branches:
      - main
    paths:
      - 'deal-card-v2.html'
      - 'assets/js/nav-v2/task-action-guard-v2.js'
      - 'assets/js/nav-v2/supabase-v2.js'
      - 'tests/e2e/task-permission-bridge.spec.js'
      - 'tests/fixtures/nav-v2-task-action-feedback.html'
      - 'config/nav-v2-task-permission-bridge-v1.json'
      - 'docs/NAV_V2_TASK_PERMISSION_BRIDGE_V1_2026-07-24.md'
      - 'scripts/check_nav_v2_task_permission_bridge_v1.py'
      - '.github/workflows/nav-v2-task-permission-bridge-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check assets/js/nav-v2/task-action-guard-v2.js
          node --check tests/e2e/task-permission-bridge.spec.js
      - name: Task permission bridge source contract
        run: python3 scripts/check_nav_v2_task_permission_bridge_v1.py
      - name: Python syntax
        run: python3 -m py_compile scripts/check_nav_v2_task_permission_bridge_v1.py

  public-browser:
    needs: semantic-static
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run task permission fallback regression
        run: npx playwright test tests/e2e/task-permission-bridge.spec.js --project=chromium-desktop --project=chromium-mobile
      - name: Upload task permission bridge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nav-v2-task-permission-bridge-v1
          path: |
            playwright-report/
            test-results/
            config/nav-v2-task-permission-bridge-v1.json
            docs/NAV_V2_TASK_PERMISSION_BRIDGE_V1_2026-07-24.md
          if-no-files-found: error
          retention-days: 14
