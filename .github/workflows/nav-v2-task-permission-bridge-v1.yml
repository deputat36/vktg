name: Navigator v2 task permission bridge

on:
  pull_request:
    paths:
      - 'deal-card-v2.html'
      - 'assets/js/nav-v2/deal-card-v2.js'
      - 'assets/js/nav-v2/task-action-guard-v2.js'
      - 'assets/js/nav-v2/task-permission-bootstrap-v1.js'
      - 'tests/unit/nav-v2-task-permission-bootstrap.test.mjs'
      - 'tests/e2e/task-action-feedback.spec.js'
      - 'config/nav-v2-task-permission-bridge-v1.json'
      - 'docs/NAV_V2_TASK_PERMISSION_BRIDGE_V1_2026-07-24.md'
      - 'scripts/check_nav_v2_task_permission_bridge_v1.py'
      - '.github/workflows/nav-v2-task-permission-bridge-v1.yml'
  push:
    branches:
      - main
    paths:
      - 'deal-card-v2.html'
      - 'assets/js/nav-v2/deal-card-v2.js'
      - 'assets/js/nav-v2/task-action-guard-v2.js'
      - 'assets/js/nav-v2/task-permission-bootstrap-v1.js'
      - 'tests/unit/nav-v2-task-permission-bootstrap.test.mjs'
      - 'tests/e2e/task-action-feedback.spec.js'
      - 'config/nav-v2-task-permission-bridge-v1.json'
      - 'docs/NAV_V2_TASK_PERMISSION_BRIDGE_V1_2026-07-24.md'
      - 'scripts/check_nav_v2_task_permission_bridge_v1.py'
      - '.github/workflows/nav-v2-task-permission-bridge-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check assets/js/nav-v2/task-permission-bootstrap-v1.js
          node --check assets/js/nav-v2/task-action-guard-v2.js
          node --check assets/js/nav-v2/deal-card-v2.js
          node --check tests/unit/nav-v2-task-permission-bootstrap.test.mjs
      - name: Task permission bootstrap unit regression
        run: node tests/unit/nav-v2-task-permission-bootstrap.test.mjs
      - name: Task permission bridge source contract
        run: python3 scripts/check_nav_v2_task_permission_bridge_v1.py
      - name: Python syntax
        run: python3 -m py_compile scripts/check_nav_v2_task_permission_bridge_v1.py
